  # --- EPSA + ChromLogD (protocols and templates built by the operator, 2026-11-13) ---
  # WuXi ships no Upload tab for these reports. The operator builds it from the report
  # ('Summary Report' for EPSA, 'Results ' for ChromLogD) and leaves out the reference
  # compounds (their Batch is 'NA'). The identifier is `Batch`: it holds the full
  # SRB-XXXXXXX-NNN batch id, and EPSA_GT / CHROMLOGD_GT map it to Molecule-Batch ID.
  # `Compound ID` is ignored globally (ignore_columns). `Date` (a Text readout) is the
  # Study Completion Date on the Signature tab, as YYYYMMDD. Every readout is required
  # in CDD, so a blank or 'NA' cell rejects the row. Keep the column order of the
  # operator's tabs: Batch, Date, Chromatographic LogDpH 7.4, R2, S.

