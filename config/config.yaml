# CDD Vault configuration — per-protocol import mappings for the Slurps API.
#
# Consumed by python/import_to_protocol.py (see docs/import_to_protocol.md).
# Single source of truth for "which upload-file column feeds which CDD readout".
#
# How to (re)populate a protocol block:
#   python3 python/import_to_protocol.py --vault 7108 --describe-protocol <PID>
# then copy each readout's `name` and `id` into the `readouts:` map below.

vault: 7108

# Optional metadata-only email on a successful import (see python/notify.py).
# Body carries counts/ids/names only — never SMILES/compound ids/row values.
# The SMTP password is NOT here: it lives in `password_file` (chmod 600), like
# ~/.cdd_token. Verify SMTP works with: import_to_protocol.py --test-notification
notifications:
  enabled: true
  on_commit: true              # email when a slurp reaches "committed"
  recipient: gtamo@seracbio.com    # who receives the notification
  sender: auto@seracbio.com        # dedicated service mailbox the app sends AS
  # `graph` = Microsoft Graph with OAuth2 app-only auth. Microsoft disables SMTP
  # basic auth by default on M365 tenants, so `smtp` below no longer works here.
  transport: graph
  tenant_id: ""                    # TODO from IT (Azure AD app registration)
  client_id: ""                    # TODO from IT
  client_secret_file: ~/.auto_graph   # holds the app secret (chmod 600, never in config)
  # --- legacy SMTP transport, kept for reference; blocked by tenant policy ---
  smtp_host: smtp.office365.com
  smtp_port: 587
  password_file: ~/.auto_smtp      # holds auto@seracbio.com's password (chmod 600)

# Extra Species spellings the CRO uses. Each key is the raw cell value, and each
# value is the `species:` string the protocol blocks route on. The match ignores
# case and outer spaces, and every protocol's own `species:` value already matches
# case-insensitively ('mouse' routes as 'Mouse'), so list only the ODD spellings.
species_aliases:
  FBS: "10%FBS"

# Columns the CRO ships that NO protocol imports. Folded into every protocol's
# own `ignore:` at config load, so a column WuXi adds across all reports is
# listed once here instead of in each block. Match is whitespace-insensitive.
# CAUTION: this only stops the column BLOCKING validation — the column is still
# present in the file sent to CDD (see wiki: `ignore:` is validation-only).
ignore_columns:
  - "Compound ID"     # redundant molecule id beside Molecule-Batch ID (2026-10-09)

protocols:

  131399:
    name: MDR1-MDCK II (inh)
    alias: mdck                        # short name for get_protocol_data --experiments
    label: MDCK-MDR1 II (with and without inh)   # short display name for the per-compound summary
    # CDD project the data belongs to (the "Project" dropdown in the web UI).
    project: FBXO31
    # Saved mapping-template name (web UI "Templates" tab). Encodes the parser
    # type (Tabular) + field->readout map. Fill in once you've saved one.
    mapping_template: "MDCK-MDR1"
    cell_line: "MDR1-MDCK II"             # Cell line value that routes a row here (vs MDCK II, 138368)
    # Batch key CDD matches on — the SRB-XXXXXXX-NNN value links the molecule,
    # so the batch id alone identifies each record.
    identifiers:
      batch_id: "Batch Molecule-Batch ID"
    # Columns present in the file but intentionally not imported (no error).
    ignore:
      - "Molecule Name"
      - "Run Lab"
    # Upload-file column name  ->  CDD readout-definition id.
