  # --- Mouse PK cassette (DMPK), split by Route ---
  # WuXi MPK reports ship NO Upload tab. The upload CSVs are BUILT from the
  # 'PK Report' tab: one row per (analyte, route), one CSV per route below.
  # Column names below ARE the upload format we hand back to WuXi.
  #   ..._IV_bolus_upl.csv -> 137872
  #   ..._PO_upl.csv       -> 138367

  137872:
    name: Mouse PK Cassette IV
    alias: mpk_iv
    label: MPK IV
    project: FBXO31
    mapping_template: "MPK_Cassette_GT"   # built 2026-11-10; binds 137872 (renamed IV 2026-11-12)
    route: "IV bolus"                     # Route value that routes a row here
    dosing: cassette                      # mpk_to_upload.py: >1 compound per dosing group
    identifiers:
      batch_id: "Molecule-Batch ID"
    ignore:
      - "Run Lab"
    readouts:
      "Study number": 2020820
      "Date": 2020821
      "Species": 2020822
      "Strain": 2025725
      "Gender": 2025726
      "Route": 2020823
      "Formulation": 2020834
      "Concentration (mg/mL)": 2025763
      "Dose (mg/kg)": 2025764
      "Dosing Volume (mL)": 2025765
      "C0 (ng/mL)": 2020826
      "Cmax (ng/mL)": 2020829
      "Clearance (mL/min/kg)": 2020827
      "Vdss (L/kg)": 2020828
      "Tmax (hr)": 2020830
      "Tlast (hr)": 2025882
      "T1/2 (hr)": 2020831
      "MRTlast (hr)": 2025883
      "AUC(last) (ng.h/mL)": 2020832
      "AUCinf (ng.h/mL)": 2025884
      "AUC (%)": 2025885
      "Bioavailability (%)": 2020833
      "Analyte": 2025886
      "Comment": 2020836
    # read by python/mpk_to_upload.py — labels match whitespace-insensitively
    report: &mpk_report                   # shared with the PO block below
      sheet: "PK Report"
      block_title: "Pharmacokinetics of"     # one block per analyte
      params_title: "PK Parameters"          # values come from the 'Mean' column right of it
      header:                                # study-header label (col B) -> upload field
        "Study No.": "Study number"
        "In-life start date": "Date"
      species_label: "Species"
      # 'Male BALB/c Mouse, Fed' -> Gender / Strain / Species / Comment
      species_pattern: '^(?P<Gender>Male|Female)\s+(?P<Strain>.+?)\s+(?P<Species>\S+)\s*(?:,\s*(?P<Comment>.+))?$'
      group_labels:                          # one column per (group, compound)
        compound: "Administered compound"
        group: "Study Group"
        dose: "Nominal dose (mg/kg)"
        formulation: "Formulation"
      # '0.20 mg/mL in 5%DMSO/5% solutol in water, clear solution' -> Formulation = the vehicle only;
      # Concentration keeps the Dose-tab value, and another value in this text is warned (2026-11-25)
      formulation_pattern: '(?i)^(?:(?P<concentration>\d+(?:\.\d+)?)\s*mg/mL\s+in\s+)?(?P<formulation>.+)$'
      analyte_labels:                        # one column per analyte
        analyte: "Analyte compound"
        batch: "Batch No."
      parameters:                            # PK Parameters label -> upload field
        "C0 (ng/mL)": "C0 (ng/mL)"
        "Cl(mL/min/kg)": "Clearance (mL/min/kg)"
        "Vdss (L/kg)": "Vdss (L/kg)"
        "Cmax (ng/mL)": "Cmax (ng/mL)"
        "Tmax (h)": "Tmax (hr)"
        "T1/2 (h)": "T1/2 (hr)"
        "Tlast (h)": "Tlast (hr)"
        "AUC0-last (ng.h/mL)": "AUC(last) (ng.h/mL)"
        "AUC0-inf (ng.h/mL)": "AUCinf (ng.h/mL)"
        "MRT0-last (h)": "MRTlast (hr)"
        "AUCExtra (%)": "AUC (%)"
        "Bioavailability (%)a": "Bioavailability (%)"
      dose_sheet: "Dose"
      dose_tab:                              # repeated tables keyed on Group No. + Test Article
        group: "Group No."
        compound: "Test Article"
        concentration: "Nominal Conc. (mg/mL)"
      fields:                                # upload fields the converter fills itself
        date: "Date"
        route: "Route"
        dose: "Dose (mg/kg)"
        formulation: "Formulation"
        concentration: "Concentration (mg/mL)"
        analyte: "Analyte"

