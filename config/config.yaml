# CDD Vault configuration — per-protocol import mappings for the Slurps API.
#
# Consumed by python/import_to_protocol.py (see docs/import_to_protocol.md).
# Single source of truth for "which upload-file column feeds which CDD readout".
#
# How to (re)populate a protocol block:
#   python3 python/import_to_protocol.py --vault 7108 --describe-protocol <PID>
# then copy each readout's `name` and `id` into the `readouts:` map below.

vault: 7108

# Optional metadata-only email on a successful import (see python/notify.py).
# Body carries counts/ids/names only — never SMILES/compound ids/row values.
# The SMTP password is NOT here: it lives in `password_file` (chmod 600), like
# ~/.cdd_token. Verify SMTP works with: import_to_protocol.py --test-notification
notifications:
  enabled: true
  on_commit: true              # email when a slurp reaches "committed"
  recipient: gtamo@seracbio.com
  sender: gtamo@seracbio.com
  smtp_host: smtp.office365.com
  smtp_port: 587
  password_file: ~/.MS_pwd.txt

protocols:

  131399:
    name: MDR1-MDCK II Inhibitor
    alias: mdck                        # short name for get_protocol_data --experiments
    label: MDCK-MDR1 II (with and without inh)   # short display name for the per-compound summary
    # CDD project the data belongs to (the "Project" dropdown in the web UI).
    project: FBXO31
    # Saved mapping-template name (web UI "Templates" tab). Encodes the parser
    # type (Tabular) + field->readout map. Fill in once you've saved one.
    mapping_template: "MDCK-MDR1"
    # Batch key CDD matches on — the SRB-XXXXXXX-NNN value links the molecule,
    # so the batch id alone identifies each record.
    identifiers:
      batch_id: "Batch Molecule-Batch ID"
    # Columns present in the file but intentionally not imported (no error).
    ignore:
      - "Molecule Name"
      - "Run Lab"
    # Upload-file column name  ->  CDD readout-definition id.
    # Keys MUST match the upload file header exactly (spelling, spacing, case,
    # and the inconsistent "PgP/Pgp inhibitor/Inhibitor" suffixes are real).
    readouts:
      "Study number": 1883900
      "Date": 1883901
      "Cell line": 1883911
      "Mean Papp A to B": 1883902
      "Mean Papp B to A": 1883903
      "Efflux ratio": 1883904
      "Mean %Solution Recovery A to B": 1883905
      "Mean %Solution Recovery B to A": 1883906
      "Provider Comment": 1883907
      "Serac Comment": 1883908
      "Permeability Class": 1883909
      "Pgp substrate": 1883912
      "Provider Name": 1883910
      "Study number - PgP inhibitor": 1883915
      "Date - PgP inhibitor": 1883916
      "Cell line - PgP inhibitor": 1883917
      "Mean Papp A to B - PgP Inhibitor": 1883919
      "Mean Papp B to A - PgP inhibitor": 1883921
      "Efflux ratio - PgP inhibitor": 1883922
      "Mean %Solution Recovery A to B - PgP inhibitor": 1883923
      "Mean %Solution Recovery B to A - PgP inhibitor": 1883924
      "Provider Comment - PgP inhibitor": 1883925
      "Serac Comment - PgP inhibitor": 1883926
      "Permeability Class - PgP inhibitor": 1883927
      "Pgp substrate - Pgp inhibitor": 1883929
      "Provider Name - PgP inhibitor": 1883930

