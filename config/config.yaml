  # --- Microsomal stability (split by species from the MMS file) ---
  # Feed the per-species files from split_species.py:
  #   ..._MMS_..._Human_upl.csv  -> 88861
  #   ..._MMS_..._Mouse_upl.csv  -> 88862
  # Column names match whitespace-insensitively, so the multi-line headers
  # (e.g. "CLint (raw)\r\r\n(μL/min/mg)") match these clean keys.
  # `Comment` -> Serac Comment is an inference; confirm vs each template.

  88861:
    name: Microsomal stability species human
    alias: hlm
    label: HLM
    project: FBXO31
    mapping_template: "HLM_GT"    # rebuilt 2026-07-09 from the new WuXi layout
    # Species value (in the file's Species column) that routes to this protocol.
    # Human + Mouse share identical readouts, so detection ties on columns alone;
    # the split-by-Species value is what picks the PID.
    species: Human
    identifiers:
